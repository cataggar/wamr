name: WASI micro-bench

# Per-PR + push-to-main host-path regression detector (#583, W11-6).
#
# Runs `zig build wasi-microbench` — drives executor →
# `dispatchCanonBuiltin` → AsyncStream → host_driver across four hot
# Preview-3 host paths (HTTP keep-alive RT, UDP receive, fs read/write-
# via-stream) and compares medians against
# `tests/benchmarks/wasi-microbench/budget.json`.
#
# The benchmark step is blocking whenever this path-filtered workflow
# runs; branch protection does not currently require the context.
# Calibrated from retained GitHub-hosted x86_64 reports on 2026-07-15.
# See `docs/wasi.md` § "Updating the wasi-microbench budget".

on:
  push:
    branches: [main]
    paths:
      - src/component/**
      - src/runtime/**
      - src/wasi/**
      - build.zig
      - build.zig.zon
      - tests/benchmarks/wasi-microbench/**
      - .github/workflows/wasi-microbench.yml
  pull_request:
    paths:
      - src/component/**
      - src/runtime/**
      - src/wasi/**
      - build.zig
      - build.zig.zon
      - tests/benchmarks/wasi-microbench/**
      - .github/workflows/wasi-microbench.yml
  workflow_dispatch:
    inputs:
      samples:
        description: "Samples per scenario"
        required: false
        default: "10"
      warmup:
        description: "Discarded warmup samples per scenario"
        required: false
        default: "2"
      threshold_pct:
        description: "Regression threshold in % over budget median"
        required: false
        default: "10"

concurrency:
  group: wasi-microbench-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  wasi-microbench:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Zig 0.16.0
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
          use-cache: false

      - name: Configure Zig caches
        uses: ./.github/actions/zig-cache

      - name: Run wasi-microbench
        id: bench
        env:
          SAMPLES: ${{ github.event.inputs.samples || '10' }}
          WARMUP: ${{ github.event.inputs.warmup || '2' }}
          THRESHOLD: ${{ github.event.inputs.threshold_pct || '10' }}
        run: |
          mkdir -p wasi-microbench-out
          zig build wasi-microbench -- \
            --samples "$SAMPLES" \
            --warmup  "$WARMUP" \
            --threshold-pct "$THRESHOLD" \
            --json    wasi-microbench-out/report.json \
            | tee wasi-microbench-out/report.txt

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wasi-microbench-${{ github.sha }}
          path: wasi-microbench-out/
          if-no-files-found: ignore
          retention-days: 90

      - name: Annotate regression
        if: failure() && steps.bench.outcome == 'failure'
        run: |
          echo "::warning::wasi-microbench reported a regression versus" \
               "tests/benchmarks/wasi-microbench/budget.json — see job log."
