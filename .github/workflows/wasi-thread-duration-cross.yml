name: WASI thread duration-cross diagnostic
run-name: >-
  WASI thread duration-cross ${{ inputs.cohort_id }}-${{
  inputs.report_sequence }}-${{ inputs.preflight_only && 'readiness' || inputs.partition }}

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Immutable diagnostic source/tag commit"
        required: true
      cohort_id:
        description: "Predeclared 32-character cohort identifier"
        required: true
      report_sequence:
        description: "Predeclared report sequence 1-20"
        required: true
      partition:
        description: "Predeclared training or holdout membership"
        type: choice
        options: [training, holdout]
        required: true
      preflight_only:
        description: "One-shot gate readiness; collect no benchmark report"
        type: boolean
        default: false
      preflight_platform:
        description: "Readiness-only platform (ignored for a full diagnostic)"
        type: choice
        options: [x86, arm]
        default: x86

concurrency:
  group: wasi-thread-duration-cross-diagnostic-${{ inputs.cohort_id }}-${{ inputs.report_sequence }}-${{ inputs.preflight_only && inputs.preflight_platform || 'full' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  x86:
    name: Hosted x86 duration-cross
    if: ${{ !inputs.preflight_only || inputs.preflight_platform == 'x86' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 720
    permissions:
      actions: read
      contents: read
      attestations: read
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        slot: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      ROOT: /d/wamr-duration-cross/${{ github.run_id }}-${{ github.run_attempt }}-x86
      HOME: /d/wamr-duration-cross/${{ github.run_id }}-${{ github.run_attempt }}-x86/home
      TMPDIR: /d/wamr-duration-cross/${{ github.run_id }}-${{ github.run_attempt }}-x86/tmp
      XDG_CACHE_HOME: /d/wamr-duration-cross/${{ github.run_id }}-${{ github.run_attempt }}-x86/xdg-cache
      ZIG_GLOBAL_CACHE_DIR: /d/wamr-duration-cross/${{ github.run_id }}-${{ github.run_attempt }}-x86/zig-global-cache
      ZIG_LOCAL_CACHE_DIR: /d/wamr-duration-cross/${{ github.run_id }}-${{ github.run_attempt }}-x86/zig-local-cache
    steps:
      - name: Acquire target x86 CPU class
        id: acquire
        env:
          GH_TOKEN: ${{ github.token }}
          PREFLIGHT_ONLY: ${{ inputs.preflight_only }}
          SLOT: ${{ matrix.slot }}
          TARGET_CPU_CLASS: "AMD EPYC 7763 64-Core Processor"
        run: |
          set -euo pipefail
          if [ "$PREFLIGHT_ONLY" = true ]; then
            EXPECTED_ARTIFACT="wasi-thread-duration-cross-readiness-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          else
            EXPECTED_ARTIFACT="wasi-thread-duration-cross-ubuntu-22.04-x86_64-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          fi
          EXISTING="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --jq ".artifacts[] | select(.name == \"${EXPECTED_ARTIFACT}\") | .name")"
          if [ -n "$EXISTING" ]; then
            echo "Artifact $EXPECTED_ARTIFACT already uploaded by an earlier slot; skipping slot $SLOT."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ACTUAL_CPU="$(grep -m1 '^model name' /proc/cpuinfo | sed 's/^[^:]*:[[:space:]]*//')"
          echo "Slot $SLOT assigned CPU: $ACTUAL_CPU"
          if [ "$ACTUAL_CPU" = "$TARGET_CPU_CLASS" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$SLOT" -ge 8 ]; then
            echo "Failed to acquire $TARGET_CPU_CLASS after $SLOT slots (last CPU: $ACTUAL_CPU)" >&2
            exit 1
          fi
          echo "Skipping non-target CPU $ACTUAL_CPU on slot $SLOT; next slot will request a fresh runner."
          echo "should_run=false" >> "$GITHUB_OUTPUT"

      - name: Validate runner and create run-scoped paths
        if: ${{ steps.acquire.outputs.should_run == 'true' }}
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          COHORT_ID: ${{ inputs.cohort_id }}
          REPORT_SEQUENCE: ${{ inputs.report_sequence }}
          PARTITION: ${{ inputs.partition }}
          PREFLIGHT_ONLY: ${{ inputs.preflight_only }}
          PREFLIGHT_PLATFORM: ${{ inputs.preflight_platform }}
        run: |
          set -euo pipefail
          sudo mkdir -p /d/wamr-duration-cross
          sudo chown "$USER":"$(id -gn)" /d /d/wamr-duration-cross
          case "$ROOT:$HOME:$TMPDIR:$XDG_CACHE_HOME:$ZIG_GLOBAL_CACHE_DIR:$ZIG_LOCAL_CACHE_DIR" in
            /d/*:/d/*:/d/*:/d/*:/d/*:/d/*) ;;
            *) echo "all diagnostic paths must remain under /d" >&2; exit 2 ;;
          esac
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          grep -q 'model name' /proc/cpuinfo
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(find /proc/[0-9]*/comm -type f -exec cat {} \; 2>/dev/null | grep -c '^Runner.Worker$')" = 1
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$COHORT_ID" =~ ^[0-9a-f]{32}$ ]]
          [[ "$REPORT_SEQUENCE" =~ ^([1-9]|1[0-9]|20)$ ]]
          EXPECTED_PARTITION=training
          (( REPORT_SEQUENCE >= 17 )) && EXPECTED_PARTITION=holdout
          test "$PARTITION" = "$EXPECTED_PARTITION"
          test "$PREFLIGHT_PLATFORM" = x86
          if [ "$PREFLIGHT_ONLY" = true ]; then
            test "$REPORT_SEQUENCE" = 1
            test "$PARTITION" = training
          fi
          [[ "$GITHUB_REF" =~ ^refs/tags/wasi-thread-duration-cross-[A-Za-z0-9][A-Za-z0-9._-]*$ ]]
          test "$GITHUB_SHA" = "$SOURCE_SHA"
          mkdir -p "$ROOT"/{home,tmp,xdg-cache,zig-global-cache,zig-local-cache,zig,output,source}

      - name: Fetch and validate immutable trusted source
        if: ${{ steps.acquire.outputs.should_run == 'true' }}
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          git -C "$ROOT/source" init
          git -C "$ROOT/source" remote add origin https://github.com/cataggar/wamr.git
          git -C "$ROOT/source" fetch --depth=1 origin "$SOURCE_SHA"
          git -C "$ROOT/source" checkout --detach FETCH_HEAD
          test "$(git -C "$ROOT/source" rev-parse HEAD)" = "$SOURCE_SHA"
          git -C "$ROOT/source" fetch --depth=256 origin main
          git -C "$ROOT/source" merge-base --is-ancestor "$SOURCE_SHA" origin/main
          test -z "$(git -C "$ROOT/source" status --porcelain)"

      - name: Install Zig 0.17.0
        if: ${{ steps.acquire.outputs.should_run == 'true' }}
        uses: cataggar/ghr/actions/install@a3be8c61b9d5c2bd6d38e6d067c69d70434a6db9 # v0.9.1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          ghr-version: v0.9.1
          tools: |
            cataggar/zig@v0.17.0 RWSGOq2NVecA2UPNdBUZykf1CCb147pkmdtYxgb3Ti+JO/wCYvhbAb/U
            cataggar/zig@v0.16.0 ?id=wamr-benchmark-zig016&alias=zig:zig016 RWSGOq2NVecA2UPNdBUZykf1CCb147pkmdtYxgb3Ti+JO/wCYvhbAb/U

      - name: Test diagnostic harness
        if: ${{ steps.acquire.outputs.should_run == 'true' }}
        run: python3 "$ROOT/source/scripts/test_wasi_thread_duration_cross.py"

      - name: Run x86 duration-cross report
        if: ${{ steps.acquire.outputs.should_run == 'true' && !inputs.preflight_only }}
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          COHORT_ID: ${{ inputs.cohort_id }}
          REPORT_SEQUENCE: ${{ inputs.report_sequence }}
        run: |
          set -euo pipefail
          python3 "$ROOT/source/scripts/wasi_thread_duration_cross.py" \
            --repo "$ROOT/source" \
            --output-dir "$ROOT/output" \
            --source-sha "$SOURCE_SHA" \
            --platform-id ubuntu-22.04-x86_64 \
            --report-sequence "$REPORT_SEQUENCE" \
            --cohort-id "$COHORT_ID" \
            --runner-environment github-hosted \
            --host-pair-id "github:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}:ubuntu-22.04-x86_64" \
            --timeout 180
          cat "$ROOT/output/report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Run x86 gate-readiness probe
        if: ${{ steps.acquire.outputs.should_run == 'true' && inputs.preflight_only }}
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          COHORT_ID: ${{ inputs.cohort_id }}
        run: |
          set -euo pipefail
          python3 "$ROOT/source/scripts/wasi_thread_duration_cross.py" \
            --repo "$ROOT/source" \
            --output-dir "$ROOT/output" \
            --source-sha "$SOURCE_SHA" \
            --platform-id ubuntu-22.04-x86_64 \
            --report-sequence 1 \
            --cohort-id "$COHORT_ID" \
            --runner-environment github-hosted \
            --host-pair-id "github:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}:ubuntu-22.04-x86_64" \
            --timeout 180 \
            --preflight-only
          cat "$ROOT/output/preflight-readiness.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload x86 diagnostic report
        if: ${{ always() && steps.acquire.outputs.should_run == 'true' && !inputs.preflight_only }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wasi-thread-duration-cross-ubuntu-22.04-x86_64-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /d/wamr-duration-cross/${{ github.run_id }}-${{ github.run_attempt }}-x86/output/report.json
            /d/wamr-duration-cross/${{ github.run_id }}-${{ github.run_attempt }}-x86/output/report.md
          if-no-files-found: error
          retention-days: 90

      - name: Retain x86 gate-readiness result
        if: ${{ success() && steps.acquire.outputs.should_run == 'true' && inputs.preflight_only }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wasi-thread-duration-cross-readiness-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /d/wamr-duration-cross/${{ github.run_id }}-${{ github.run_attempt }}-x86/output/preflight-readiness.json
            /d/wamr-duration-cross/${{ github.run_id }}-${{ github.run_attempt }}-x86/output/preflight-readiness.md
          if-no-files-found: error
          retention-days: 90

      - name: Retain x86 preflight failure evidence
        if: ${{ always() && steps.acquire.outputs.should_run == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wasi-thread-duration-cross-failure-x86-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /d/wamr-duration-cross/${{ github.run_id }}-${{ github.run_attempt }}-x86/output/failure-diagnostic.json
            /d/wamr-duration-cross/${{ github.run_id }}-${{ github.run_attempt }}-x86/output/failure-diagnostic.md
          if-no-files-found: ignore
          retention-days: 90

      - name: Clean run-scoped files
        if: ${{ always() && steps.acquire.outputs.should_run == 'true' }}
        run: |
          set -euo pipefail
          case "$ROOT" in
            "/d/wamr-duration-cross/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-x86") ;;
            *) exit 2 ;;
          esac
          rm -rf -- "$ROOT" || { sleep 1; rm -rf -- "$ROOT"; }

  arm:
    name: Neoverse-N2 duration-cross
    if: ${{ !inputs.preflight_only || inputs.preflight_platform == 'arm' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 720
    permissions:
      contents: read
      attestations: read
    env:
      ROOT: /d/wamr-duration-cross/${{ github.run_id }}-${{ github.run_attempt }}-arm
      HOME: /d/wamr-duration-cross/${{ github.run_id }}-${{ github.run_attempt }}-arm/home
      TMPDIR: /d/wamr-duration-cross/${{ github.run_id }}-${{ github.run_attempt }}-arm/tmp
      XDG_CACHE_HOME: /d/wamr-duration-cross/${{ github.run_id }}-${{ github.run_attempt }}-arm/xdg-cache
      ZIG_GLOBAL_CACHE_DIR: /d/wamr-duration-cross/${{ github.run_id }}-${{ github.run_attempt }}-arm/zig-global-cache
      ZIG_LOCAL_CACHE_DIR: /d/wamr-duration-cross/${{ github.run_id }}-${{ github.run_attempt }}-arm/zig-local-cache
    steps:
      - name: Validate runner and create run-scoped paths
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          COHORT_ID: ${{ inputs.cohort_id }}
          REPORT_SEQUENCE: ${{ inputs.report_sequence }}
          PARTITION: ${{ inputs.partition }}
          PREFLIGHT_ONLY: ${{ inputs.preflight_only }}
          PREFLIGHT_PLATFORM: ${{ inputs.preflight_platform }}
        run: |
          set -euo pipefail
          sudo mkdir -p /d/wamr-duration-cross
          sudo chown "$USER":"$(id -gn)" /d /d/wamr-duration-cross
          case "$ROOT:$HOME:$TMPDIR:$XDG_CACHE_HOME:$ZIG_GLOBAL_CACHE_DIR:$ZIG_LOCAL_CACHE_DIR" in
            /d/*:/d/*:/d/*:/d/*:/d/*:/d/*) ;;
            *) echo "all diagnostic paths must remain under /d" >&2; exit 2 ;;
          esac
          lscpu | grep -F 'Neoverse-N2'
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(find /proc/[0-9]*/comm -type f -exec cat {} \; 2>/dev/null | grep -c '^Runner.Worker$')" = 1
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$COHORT_ID" =~ ^[0-9a-f]{32}$ ]]
          [[ "$REPORT_SEQUENCE" =~ ^([1-9]|1[0-9]|20)$ ]]
          EXPECTED_PARTITION=training
          (( REPORT_SEQUENCE >= 17 )) && EXPECTED_PARTITION=holdout
          test "$PARTITION" = "$EXPECTED_PARTITION"
          if [ "$PREFLIGHT_ONLY" = true ]; then
            test "$PREFLIGHT_PLATFORM" = arm
            test "$REPORT_SEQUENCE" = 1
            test "$PARTITION" = training
          else
            test "$PREFLIGHT_PLATFORM" = x86
          fi
          [[ "$GITHUB_REF" =~ ^refs/tags/wasi-thread-duration-cross-[A-Za-z0-9][A-Za-z0-9._-]*$ ]]
          test "$GITHUB_SHA" = "$SOURCE_SHA"
          mkdir -p "$ROOT"/{home,tmp,xdg-cache,zig-global-cache,zig-local-cache,zig,output,source}

      - name: Fetch and validate immutable trusted source
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          git -C "$ROOT/source" init
          git -C "$ROOT/source" remote add origin https://github.com/cataggar/wamr.git
          git -C "$ROOT/source" fetch --depth=1 origin "$SOURCE_SHA"
          git -C "$ROOT/source" checkout --detach FETCH_HEAD
          test "$(git -C "$ROOT/source" rev-parse HEAD)" = "$SOURCE_SHA"
          git -C "$ROOT/source" fetch --depth=256 origin main
          git -C "$ROOT/source" merge-base --is-ancestor "$SOURCE_SHA" origin/main
          test -z "$(git -C "$ROOT/source" status --porcelain)"

      - name: Install Zig 0.17.0
        uses: cataggar/ghr/actions/install@a3be8c61b9d5c2bd6d38e6d067c69d70434a6db9 # v0.9.1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          ghr-version: v0.9.1
          tools: |
            cataggar/zig@v0.17.0 RWSGOq2NVecA2UPNdBUZykf1CCb147pkmdtYxgb3Ti+JO/wCYvhbAb/U
            cataggar/zig@v0.16.0 ?id=wamr-benchmark-zig016&alias=zig:zig016 RWSGOq2NVecA2UPNdBUZykf1CCb147pkmdtYxgb3Ti+JO/wCYvhbAb/U

      - name: Test diagnostic harness
        if: ${{ inputs.preflight_only }}
        run: python3 "$ROOT/source/scripts/test_wasi_thread_duration_cross.py"

      - name: Run Arm duration-cross report
        if: ${{ !inputs.preflight_only }}
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          COHORT_ID: ${{ inputs.cohort_id }}
          REPORT_SEQUENCE: ${{ inputs.report_sequence }}
        run: |
          set -euo pipefail
          python3 "$ROOT/source/scripts/wasi_thread_duration_cross.py" \
            --repo "$ROOT/source" \
            --output-dir "$ROOT/output" \
            --source-sha "$SOURCE_SHA" \
            --platform-id ubuntu-24.04-aarch64 \
            --report-sequence "$REPORT_SEQUENCE" \
            --cohort-id "$COHORT_ID" \
            --runner-environment github-hosted \
            --host-pair-id "github:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}:ubuntu-24.04-aarch64" \
            --timeout 180
          cat "$ROOT/output/report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Run Arm gate-readiness probe
        if: ${{ inputs.preflight_only }}
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          COHORT_ID: ${{ inputs.cohort_id }}
        run: |
          set -euo pipefail
          python3 "$ROOT/source/scripts/wasi_thread_duration_cross.py" \
            --repo "$ROOT/source" \
            --output-dir "$ROOT/output" \
            --source-sha "$SOURCE_SHA" \
            --platform-id ubuntu-24.04-aarch64 \
            --report-sequence 1 \
            --cohort-id "$COHORT_ID" \
            --runner-environment github-hosted \
            --host-pair-id "github:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}:ubuntu-24.04-aarch64" \
            --timeout 180 \
            --preflight-only
          cat "$ROOT/output/preflight-readiness.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Arm diagnostic report
        if: ${{ always() && !inputs.preflight_only }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wasi-thread-duration-cross-ubuntu-24.04-aarch64-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /d/wamr-duration-cross/${{ github.run_id }}-${{ github.run_attempt }}-arm/output/report.json
            /d/wamr-duration-cross/${{ github.run_id }}-${{ github.run_attempt }}-arm/output/report.md
          if-no-files-found: error
          retention-days: 90

      - name: Retain Arm gate-readiness result
        if: ${{ success() && inputs.preflight_only }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wasi-thread-duration-cross-readiness-arm-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /d/wamr-duration-cross/${{ github.run_id }}-${{ github.run_attempt }}-arm/output/preflight-readiness.json
            /d/wamr-duration-cross/${{ github.run_id }}-${{ github.run_attempt }}-arm/output/preflight-readiness.md
          if-no-files-found: error
          retention-days: 90

      - name: Retain Arm preflight failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wasi-thread-duration-cross-failure-arm-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /d/wamr-duration-cross/${{ github.run_id }}-${{ github.run_attempt }}-arm/output/failure-diagnostic.json
            /d/wamr-duration-cross/${{ github.run_id }}-${{ github.run_attempt }}-arm/output/failure-diagnostic.md
          if-no-files-found: ignore
          retention-days: 90

      - name: Clean run-scoped files
        if: always()
        run: |
          set -euo pipefail
          case "$ROOT" in
            "/d/wamr-duration-cross/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-arm") ;;
            *) exit 2 ;;
          esac
          rm -rf -- "$ROOT" || { sleep 1; rm -rf -- "$ROOT"; }
