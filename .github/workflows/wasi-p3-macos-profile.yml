name: WASI P3 macOS ARM64 profile

# Manual, non-blocking investigation for #616 D3. This is deliberately not a
# PR/push gate: it compares native hosted ARM64 machines at one exact revision,
# validates every retained unfiltered suite sample at 41/41, and keeps timing
# policy separate from normal conformance and Linux x86_64 benchmark budgets.
on:
  workflow_dispatch:

concurrency:
  group: wasi-p3-macos-profile-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  measure:
    name: Measure (${{ matrix.platform_id }}, ${{ matrix.mode }})
    strategy:
      fail-fast: false
      matrix:
        platform_id: [macos-arm64, linux-arm64]
        mode: [aot, jit]
        include:
          - platform_id: macos-arm64
            runner: macos-14
          - platform_id: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # AOT and JIT are separate jobs so each mode gets a full budget. Run
    # 31259495409 was cancelled at this timeout while still inside the AOT
    # phase on both platforms, leaving the JIT phase unreachable and — because
    # a job-level timeout cancels the job rather than failing a step — skipping
    # the `if: always()` upload and destroying every diagnostic. The harness
    # `--deadline-minutes` below is what actually stops the work, so the upload
    # and enforcement steps always run. (#616 D3.)
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: true

      - name: Install Zig 0.16.0
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
          use-cache: false

      - name: Configure isolated Zig caches
        uses: ./.github/actions/zig-cache

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install wasi-testsuite runner dependencies
        run: pip install -r tests/wasi-testsuite/test-runner/requirements.txt

      - name: Record raw host metadata
        env:
          OUT: wasi-p3-measure-${{ matrix.platform_id }}-${{ matrix.mode }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          {
            uname -a
            if command -v sw_vers >/dev/null; then sw_vers; fi
            if command -v sysctl >/dev/null; then
              sysctl -n machdep.cpu.brand_string 2>/dev/null || true
              sysctl -n hw.memsize 2>/dev/null || true
            fi
            if command -v lscpu >/dev/null; then lscpu; fi
          } > "$OUT/platform.txt"
          env | LC_ALL=C sort | grep -E \
            '^(ImageOS|RUNNER_|ZIG_(GLOBAL|LOCAL)_CACHE_DIR)=' \
            > "$OUT/runner-environment.txt"

      - name: Build ReleaseSafe tools
        run: |
          if [ '${{ matrix.mode }}' = jit ]; then
            zig build -Doptimize=ReleaseSafe -Djit=true
          else
            zig build -Doptimize=ReleaseSafe
          fi

      - name: Measure ${{ matrix.mode }} — 5 cold and 10 warm unfiltered suites
        id: measure
        continue-on-error: true
        env:
          WAMR: ${{ github.workspace }}/zig-out/bin/wamr
          WAMRC: ${{ github.workspace }}/zig-out/bin/wamrc
          # Match `build.zig`'s unfiltered P3 gates. Without this the adapter
          # falls back to its 5s default, which is far tighter than the gate
          # these measurements are meant to mirror. JIT recompiles every
          # fixture in-process with no cross-process cache, so it needs more.
          WAMR_TESTSUITE_TIMEOUT: ${{ matrix.mode == 'jit' && '120' || '30' }}
          # Bound adapter-side `wamrc` precompilation, which runs before the
          # guest process exists and is therefore not covered above.
          WAMR_COMPILE_TIMEOUT: "600"
        run: |
          python3 scripts/wasi_p3_profile.py run \
            --mode '${{ matrix.mode }}' \
            --platform-id '${{ matrix.platform_id }}' \
            --cold-samples 5 \
            --warm-samples 10 \
            --sample-timeout 900 \
            --deadline-minutes 300 \
            --output-dir 'wasi-p3-measure-${{ matrix.platform_id }}-${{ matrix.mode }}/${{ matrix.mode }}'

      # Runs in every job so each uploaded artifact is self-contained and the
      # aggregate does not depend on artifact ordering to find a report.
      - name: Characterize wasi-microbench without budget enforcement
        id: microbench
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          OUT='wasi-p3-measure-${{ matrix.platform_id }}-${{ matrix.mode }}/microbench'
          mkdir -p "$OUT"
          zig build wasi-microbench -Doptimize=ReleaseSafe -- \
            --samples 10 \
            --warmup 2 \
            --no-budget \
            --json "$OUT/report.json" \
            > "$OUT/report.txt" 2>&1

      - name: Upload raw measurements and conformance reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wasi-p3-measure-${{ matrix.platform_id }}-${{ matrix.mode }}
          path: wasi-p3-measure-${{ matrix.platform_id }}-${{ matrix.mode }}/
          if-no-files-found: error
          retention-days: 90

      - name: Enforce successful measurement phases
        if: always()
        env:
          MEASURE: ${{ steps.measure.outcome }}
          MICROBENCH: ${{ steps.microbench.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          for phase in MEASURE MICROBENCH; do
            outcome="${!phase}"
            printf '%s=%s\n' "$phase" "$outcome"
            if [ "$outcome" != success ]; then failed=1; fi
          done
          exit "$failed"

  aggregate:
    name: Validate and aggregate
    needs: measure
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download matched measurements
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: wasi-p3-measure-*
          path: measurements

      - name: Require 60 valid 41/41 samples and aggregate
        run: |
          python3 scripts/wasi_p3_profile_aggregate.py \
            --input-dir measurements \
            --output-dir aggregate

      - name: Upload structured aggregate and profile plan
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wasi-p3-matched-aggregate
          path: aggregate/
          if-no-files-found: error
          retention-days: 90

  sample-macos:
    name: Capture macOS sampling profiles
    needs: aggregate
    runs-on: macos-14
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: true

      - name: Install Zig 0.16.0
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
          use-cache: false

      - name: Configure isolated Zig caches
        uses: ./.github/actions/zig-cache

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install wasi-testsuite runner dependencies
        run: pip install -r tests/wasi-testsuite/test-runner/requirements.txt

      - name: Download validated profile selection
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wasi-p3-matched-aggregate
          path: aggregate

      - name: Build and profile ReleaseSafe AOT phases
        env:
          WAMR: ${{ github.workspace }}/zig-out/bin/wamr
          WAMRC: ${{ github.workspace }}/zig-out/bin/wamrc
        run: |
          zig build -Doptimize=ReleaseSafe
          python3 scripts/wasi_p3_profile.py profile \
            --mode aot \
            --selection aggregate/profile-selection.json \
            --output-dir profiles

      - name: Build and profile ReleaseSafe JIT phases
        env:
          WAMR: ${{ github.workspace }}/zig-out/bin/wamr
          WAMRC: ${{ github.workspace }}/zig-out/bin/wamrc
        run: |
          zig build -Doptimize=ReleaseSafe -Djit=true
          python3 scripts/wasi_p3_profile.py profile \
            --mode jit \
            --selection aggregate/profile-selection.json \
            --output-dir profiles

      - name: Upload macOS sampling profiles
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wasi-p3-macos-sampling-profiles
          path: profiles/
          if-no-files-found: error
          retention-days: 90
