name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: "Version to verify without publishing (for example 3.0.0-dev.14)"
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  prepare:
    name: Validate release version
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      pep440: ${{ steps.version.outputs.pep440 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Release tooling tests
        run: python3 -m unittest discover -s scripts -p test_release_artifacts.py
      - name: Resolve version
        id: version
        env:
          RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: python3 scripts/release_artifacts.py version "$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.name }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    # Windows targets sign via Azure Trusted Signing over OIDC. Run those
    # jobs in the `release` GitHub Environment so their OIDC subject is the
    # tag-independent `repo:cataggar/wamr:environment:release`, matched by a
    # single federated identity credential — subject-based FICs can't
    # wildcard `refs/tags/v*`, so a per-tag FIC would otherwise be needed
    # before every release (cataggar/wamr#830). Non-Windows jobs get no
    # environment (empty string) so a future environment protection rule
    # can't gate the whole matrix.
    environment: ${{ endsWith(matrix.target, '-windows') && 'release' || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-linux
            name: linux-x64
          - os: ubuntu-22.04-arm
            target: aarch64-linux
            name: linux-arm64
          - os: macos-14
            target: aarch64-macos
            name: macos-arm64
          - os: windows-latest
            target: x86_64-windows
            name: windows-x64
          # Cross-compiled targets
          - os: ubuntu-22.04
            target: x86_64-macos
            name: macos-x64
          - os: ubuntu-22.04
            target: x86_64-linux-musl
            name: linux-musl-x64
          - os: ubuntu-22.04
            target: aarch64-linux-musl
            name: linux-musl-arm64
          - os: ubuntu-22.04
            target: riscv64-linux
            name: linux-riscv64
          - os: windows-latest
            target: aarch64-windows
            name: windows-arm64

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
          use-cache: false

      - name: Configure Zig caches
        uses: ./.github/actions/zig-cache

      - name: Build
        shell: bash
        run: zig build -Doptimize=ReleaseFast -Dtarget=${{ matrix.target }} -Dstrip=true -Dstack-protector=true "-Dversion=$RELEASE_VERSION" -j4

      - name: Azure login (for signing)
        if: endsWith(matrix.target, '-windows')
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Sign Windows binaries with Trusted Signing
        if: endsWith(matrix.target, '-windows')
        uses: azure/trusted-signing-action@b443cf8ea4124818d2ea9f043cba29fc3ec47b16 # v1.2.0
        with:
          endpoint: ${{ vars.TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.TRUSTED_SIGNING_PROFILE }}
          files-folder: zig-out/bin
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Package
        shell: bash
        run: |
          PKGNAME="wamr-$RELEASE_VERSION-${{ matrix.name }}"
          TOOLS="wamr wamrc"
          mkdir -p "$PKGNAME/bin"
          case "${{ matrix.target }}" in
            wasm32-wasi) EXT=".wasm" ;;
            *-windows)   EXT=".exe" ;;
            *)           EXT="" ;;
          esac
          for tool in $TOOLS; do
            cp "zig-out/bin/${tool}${EXT}" "$PKGNAME/bin/"
          done
          cp LICENSE README.md "$PKGNAME/"
          case "${{ matrix.target }}" in
            *-windows)
              if command -v zip &>/dev/null; then
                zip -r "$PKGNAME.zip" "$PKGNAME"
              else
                powershell -Command "Compress-Archive -Path '$PKGNAME' -DestinationPath '$PKGNAME.zip'"
              fi
              ;;
            *)
              tar czf "$PKGNAME.tar.gz" "$PKGNAME"
              ;;
          esac

      - name: Verify packaged tools
        shell: bash
        run: |
          PKGNAME="wamr-$RELEASE_VERSION-${{ matrix.name }}"
          EXTRA=()
          case "${{ matrix.name }}" in
            linux-x64|linux-arm64|macos-arm64|windows-x64)
              EXTRA+=(--require-smoke) ;;
          esac
          case "${{ matrix.target }}" in
            *-windows)
              PYTHON=python
              ARCHIVE="$PKGNAME.zip"
              EXTRA+=(--require-signature)
              ;;
            *)
              PYTHON=python3
              ARCHIVE="$PKGNAME.tar.gz"
              ;;
          esac
          "$PYTHON" scripts/release_artifacts.py verify \
            --version "$RELEASE_VERSION" --source-sha "$GITHUB_SHA" \
            --platform "${{ matrix.name }}" --archive "$ARCHIVE" \
            --work-dir .release-smoke --output "$PKGNAME.verification.json" \
            "${EXTRA[@]}"

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: wamr-${{ needs.prepare.outputs.version }}-${{ matrix.name }}/
          output-file: wamr-${{ needs.prepare.outputs.version }}-${{ matrix.name }}.sbom.spdx.json
          upload-artifact: false
          # Publishing is centralized in the tag-only release step.
          upload-release-assets: false

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.name }}
          retention-days: 7
          path: |
            wamr-*.tar.gz
            wamr-*.zip
            wamr-*.sbom.spdx.json
            wamr-*.verification.json

  source:
    name: Source tarball
    needs: prepare
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Package source
        run: |
          PKGNAME="wamr-$RELEASE_VERSION"
          git archive --format=tar --prefix="$PKGNAME/" HEAD | xz > "$PKGNAME.tar.xz"

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: source
          retention-days: 7
          path: |
            wamr-*.tar.xz

  release:
    name: Verify release inventory
    needs: [prepare, build, source]
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          merge-multiple: true
          path: release-assets

      - name: Verify inventory and generate checksums
        run: |
          python3 scripts/release_artifacts.py manifest \
            --version "$RELEASE_VERSION" --source-sha "$GITHUB_SHA" \
            --directory release-assets
          cd release-assets
          sha256sum --check SHA256SUMS

      - name: Attest build provenance
        id: provenance
        uses: actions/attest-build-provenance@c074443f1aee8d4aeeae555aebba3282517141b2 # v2.2.3
        with:
          subject-path: |
            release-assets/wamr-*.tar.gz
            release-assets/wamr-*.tar.xz
            release-assets/wamr-*.zip
            release-assets/wamr-*.sbom.spdx.json
            release-assets/wamr-*.verification.json
            release-assets/release-manifest.json
            release-assets/RELEASE_NOTES.md
            release-assets/SHA256SUMS

      - name: Retain release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-evidence
          retention-days: 30
          path: |
            release-assets/*.json
            release-assets/SHA256SUMS
            release-assets/RELEASE_NOTES.md
            ${{ steps.provenance.outputs.bundle-path }}

      - name: Create release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        with:
          name: wamr ${{ needs.prepare.outputs.version }}
          body_path: release-assets/RELEASE_NOTES.md
          files: |
            release-assets/wamr-*.tar.gz
            release-assets/wamr-*.tar.xz
            release-assets/wamr-*.zip
            release-assets/wamr-*.sbom.spdx.json
            release-assets/wamr-*.verification.json
            release-assets/release-manifest.json
            release-assets/RELEASE_NOTES.md
            release-assets/SHA256SUMS
          fail_on_unmatched_files: true
          draft: false
          prerelease: ${{ contains(needs.prepare.outputs.version, 'dev') }}
          make_latest: ${{ contains(needs.prepare.outputs.version, 'dev') && 'false' || 'legacy' }}
