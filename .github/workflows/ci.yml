name: Zig CI

on:
  push:
    branches: [zig, main]
  pull_request:
    branches: [zig, main]

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux-x64
            shell: bash
          - os: ubuntu-22.04-arm
            name: linux-arm64
            shell: bash
          - os: macos-14
            name: macos-arm64
            shell: bash
          - os: windows-latest
            name: windows-x64
            shell: pwsh

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: true

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
          use-cache: false

      - name: Configure Zig caches
        uses: ./.github/actions/zig-cache

      - name: Build (Debug)
        continue-on-error: true
        run: zig build

      - name: Unit tests
        run: zig build test

      - name: Build (ReleaseSafe)
        continue-on-error: true
        run: zig build -Doptimize=ReleaseSafe

      - name: Build (wasm32-wasi cross-compile)
        continue-on-error: true
        run: zig build -Doptimize=ReleaseSafe -Dtarget=wasm32-wasi -Dstrip=true

      - name: Spec tests (JSON)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ -d tests/spec-json ]; then
            result=$(./zig-out/bin/spec-test-runner tests/spec-json 2>&1 | tail -6)
            echo "$result"
            passed=$(echo "$result" | grep -oP 'Passed:\s+\K[0-9]+' || echo "0")
            failed=$(echo "$result" | grep -oP 'Failed:\s+\K[0-9]+' || echo "0")
            echo "Results: $passed passed, $failed failed"
            if [ "${failed:-0}" -gt 0 ]; then
              echo "::error::$failed spec test failures"
              exit 1
            fi
          else
            echo "::notice::No JSON spec tests found"
          fi

      - name: Spec tests (JSON — Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path tests/spec-json) {
            $result = & .\zig-out\bin\spec-test-runner.exe tests\spec-json 2>&1 | Select-Object -Last 6
            $result | ForEach-Object { Write-Host $_ }
            $joined = $result -join "`n"
            if ($joined -match 'Failed:\s+(\d+)') {
              $failed = [int]$Matches[1]
              if ($failed -gt 0) {
                Write-Host "::error::$failed spec test failures"
                exit 1
              }
            }
          } else {
            Write-Host "::notice::No JSON spec tests found"
          }

  wasi-test:
    name: Build & Test (wasm32-wasi via wasmtime)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: true

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
          use-cache: false

      - name: Configure Zig caches
        uses: ./.github/actions/zig-cache

      - name: Install wasmtime
        run: |
          curl https://wasmtime.dev/install.sh -sSf | bash -s -- --version v44.0.1
          echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"

      - name: Build for wasm32-wasi
        continue-on-error: true
        run: zig build -Doptimize=ReleaseSafe -Dtarget=wasm32-wasi -Dstrip=true

      - name: Run wamr via wasmtime
        run: |
          wasmtime --version
          # Smoke test: run the wasm binary with --help or similar
          wasmtime zig-out/bin/wamr.wasm -- --version || echo "wamr.wasm executed (exit code: $?)"

  wasi-testsuite:
    name: Build & Test (wasi-testsuite)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: true

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
          use-cache: false

      - name: Configure Zig caches
        uses: ./.github/actions/zig-cache

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install wasi-testsuite runner deps
        run: |
          pip install --user -r tests/wasi-testsuite/test-runner/requirements.txt

      - name: Build wamr (Debug)
        run: zig build

      - name: Run wasi-testsuite conformance suite
        run: zig build wasi-testsuite

  component-examples:
    name: Build & Test (component-examples)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: true

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
          use-cache: false

      - name: Configure Zig caches
        uses: ./.github/actions/zig-cache

      - name: Install cataggar/wabt (component CLI)
        uses: ./.github/actions/wabt-install

      - name: Install Rust wasm32-wasip1 target
        run: rustup target add wasm32-wasip1

      - name: Build and run component-examples (wamr golden)
        run: zig build install component-examples component-examples-run

  wasi-p2-testsuite:
    name: Build & Test (wasi-p2-testsuite)
    runs-on: ubuntu-22.04
    # Mirrors `component-examples` (same toolchain prereqs: cataggar/wabt
    # for the component-new/embed/compose pipeline + Rust wasm32-wasip1
    # for the mixed-zig-rust-calc fixture); runs the curated WASI
    # Preview 2 conformance gate (#479) — a strict superset of
    # `component-examples-run` with a CI-discoverable, named step that
    # parallels the existing Preview 1 `wasi-testsuite` job.
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: true

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
          use-cache: false

      - name: Configure Zig caches
        uses: ./.github/actions/zig-cache

      - name: Install cataggar/wabt (component CLI)
        uses: ./.github/actions/wabt-install

      - name: Install Rust wasm32-wasip1 target
        run: rustup target add wasm32-wasip1

      - name: Run WASI Preview 2 conformance gate
        run: zig build wasi-p2-testsuite

  component-examples-wasmtime:
    name: Build & Test (component-examples-wasmtime)
    runs-on: ubuntu-22.04
    # Non-blocking until the first green run + any flake handling lands.
    # ci-summary intentionally leaves this out of its needs[] failure-gate.
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: true

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
          use-cache: false

      - name: Configure Zig caches
        uses: ./.github/actions/zig-cache

      - name: Install cataggar/wabt (component CLI)
        uses: ./.github/actions/wabt-install

      - name: Install Rust wasm32-wasip1 target
        run: rustup target add wasm32-wasip1

      - name: Install wasmtime v44.0.1
        run: |
          curl https://wasmtime.dev/install.sh -sSf | bash -s -- --version v44.0.1
          echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"

      - name: Build and run component-examples (wasmtime parity)
        run: zig build install component-examples component-examples-run-wasmtime

  # Summary job matching the required status check name for branch protection.
  # `component-examples-wasmtime` is intentionally NOT in the blocking set
  # while the cross-runtime parity check beds in (cataggar/wamr#457).
  ci-summary:
    name: Build & Test
    runs-on: ubuntu-22.04
    needs: [build-and-test, wasi-test, wasi-testsuite, component-examples, wasi-p2-testsuite]
    if: always()
    steps:
      - name: Check results
        run: |
          if [ "${{ needs.build-and-test.result }}" != "success" ] || [ "${{ needs.wasi-test.result }}" != "success" ] || [ "${{ needs.wasi-testsuite.result }}" != "success" ] || [ "${{ needs.component-examples.result }}" != "success" ] || [ "${{ needs.wasi-p2-testsuite.result }}" != "success" ]; then
            echo "::error::One or more CI jobs failed"
            exit 1
          fi
          echo "All CI jobs passed"
