name: Zig CI

on:
  push:
    branches: [zig, main]
  pull_request:
    branches: [zig, main]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux-x64
            shell: bash
          - os: ubuntu-24.04-arm
            name: linux-arm64
            shell: bash
          - os: windows-latest
            name: windows-x64
            shell: pwsh

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: true

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
          use-cache: false

      - name: Configure Zig caches
        uses: ./.github/actions/zig-cache

      - name: Build (Debug)
        continue-on-error: true
        run: zig build

      - name: Unit tests
        run: zig build test

      - name: WASI thread lifecycle (enabled interpreter)
        run: zig build test-thread-lifecycle -Dlib_wasi_threads=true -Daot=false

      - name: WASI thread lifecycle (enabled AOT)
        run: zig build test-aot-threads -Dlib_wasi_threads=true -Dinterp=false

      - name: WASI thread interpreter fixtures
        run: |
          zig build update-wasi-thread-fixtures -Dlib_wasi_threads=true -Daot=false
          git diff --exit-code -- tests/wasi-threads
          zig build test-wasi-threads -Daot=false
          zig build test-wasi-threads -Dlib_wasi_threads=true -Daot=false

      - name: WASI thread AOT fixtures
        run: zig build test-wasi-threads -Dlib_wasi_threads=true -Dinterp=false

      - name: Build (ReleaseSafe)
        continue-on-error: true
        run: zig build -Doptimize=ReleaseSafe

      - name: Spec tests (JSON)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ -d tests/spec-json ]; then
            result=$(./zig-out/bin/spec-test-runner tests/spec-json 2>&1 | tail -6)
            echo "$result"
            passed=$(echo "$result" | grep -oP 'Passed:\s+\K[0-9]+' || echo "0")
            failed=$(echo "$result" | grep -oP 'Failed:\s+\K[0-9]+' || echo "0")
            echo "Results: $passed passed, $failed failed"
            if [ "${failed:-0}" -gt 0 ]; then
              echo "::error::$failed spec test failures"
              exit 1
            fi
          else
            echo "::notice::No JSON spec tests found"
          fi

      - name: Spec testsuite (full WebAssembly/spec, baseline-gated)
        if: runner.os == 'Linux'
        shell: bash
        run: python3 scripts/check_spec_baseline.py

      - name: Spec tests (JSON — Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path tests/spec-json) {
            $result = & .\zig-out\bin\spec-test-runner.exe tests\spec-json 2>&1 | Select-Object -Last 6
            $result | ForEach-Object { Write-Host $_ }
            $joined = $result -join "`n"
            if ($joined -match 'Failed:\s+(\d+)') {
              $failed = [int]$Matches[1]
              if ($failed -gt 0) {
                Write-Host "::error::$failed spec test failures"
                exit 1
              }
            }
          } else {
            Write-Host "::notice::No JSON spec tests found"
          }

  wasi-test:
    name: Build & Test (wasm32-wasi via wasmtime)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: true

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
          use-cache: false

      - name: Configure Zig caches
        uses: ./.github/actions/zig-cache

      - name: Install wasmtime
        run: |
          curl https://wasmtime.dev/install.sh -sSf | bash -s -- --version v46.0.1
          echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"

      - name: Build for wasm32-wasi
        run: zig build -Doptimize=ReleaseSafe -Dtarget=wasm32-wasi -Dstrip=true

      - name: Run wamr via wasmtime
        run: |
          wasmtime --version
          test "$(wasmtime zig-out/bin/wamr.wasm -- --version)" = "wamr dev"
          test "$(wasmtime --dir . zig-out/bin/wamr.wasm -- run tests/coldstart/hello_stdout.wasm)" = "hello from jit"

  wasi-testsuite:
    name: Build & Test (wasi-testsuite)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: true

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
          use-cache: false

      - name: Configure Zig caches
        uses: ./.github/actions/zig-cache

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install wasi-testsuite runner deps
        run: |
          pip install --user -r tests/wasi-testsuite/test-runner/requirements.txt

      - name: Build wamr (Debug)
        run: zig build

      - name: Run wasi-testsuite conformance suite
        run: zig build wasi-testsuite

  component-examples:
    name: Build & Test (component-examples)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: true

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
          use-cache: false

      - name: Configure Zig caches
        uses: ./.github/actions/zig-cache

      - name: Install cataggar/wabt (component CLI)
        uses: ./.github/actions/wabt-install

      - name: Install Rust wasm32-wasip1 target
        run: rustup target add wasm32-wasip1

      - name: Build and run component-examples (wamr golden)
        run: zig build install examples examples-run -Daot-broken-components=false

  wasi-p2-testsuite:
    name: Build & Test (wasi-p2-testsuite)
    runs-on: ubuntu-22.04
    # Mirrors `component-examples` (same toolchain prereqs: cataggar/wabt
    # for the component-new/embed/compose pipeline + Rust wasm32-wasip1
    # for the mixed-zig-rust-calc fixture); runs the curated WASI
    # Preview 2 conformance gate (#479) — a strict superset of
    # `component-examples-run` with a CI-discoverable, named step that
    # parallels the existing Preview 1 `wasi-testsuite` job.
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: true

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
          use-cache: false

      - name: Configure Zig caches
        uses: ./.github/actions/zig-cache

      - name: Install cataggar/wabt (component CLI)
        uses: ./.github/actions/wabt-install

      - name: Install Rust wasm32-wasip1 target
        run: rustup target add wasm32-wasip1

      - name: Run WASI Preview 2 conformance gate
        run: zig build wasi-p2-testsuite -Daot-broken-components=false

  wasi-p3-testsuite:
    name: Build & Test (wasi-p3-testsuite)
    runs-on: ubuntu-22.04
    # Drives the vendored wasm32-wasip3 fixtures at
    # `tests/wasi-testsuite/tests/rust/testsuite/wasm32-wasip3/` through
    # the just-built `wamr` via the in-tree `wamr-zig.py` adapter.
    # The normal filtered step remains available for local triage, while
    # this CI job uses the explicit unfiltered contract so all 41 fixtures
    # must execute even if a future expectation file accidentally grows.
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: true

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
          use-cache: false

      - name: Configure Zig caches
        uses: ./.github/actions/zig-cache

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install wasi-testsuite runner deps
        run: |
          pip install --user -r tests/wasi-testsuite/test-runner/requirements.txt

      - name: Build wamr (ReleaseSafe)
        # ReleaseSafe instead of Debug: the wasi:http@0.3.0 fixtures
        # (`http-fields` in particular) sweep ≥1024 codepoints through
        # the host adapter on every run, which the Debug interpreter
        # cannot complete inside the testsuite-runner's 5-second
        # per-`wait` timeout (#538). Safety checks still fire on this
        # build so a regression in adapter state still trips the gate.
        run: zig build -Doptimize=ReleaseSafe

      - name: Run unfiltered WASI Preview 3 conformance contract
        run: zig build wasi-p3-testsuite-unfiltered -Doptimize=ReleaseSafe

  wasi-p3-testsuite-arm64:
    name: Build & Test (wasi-p3-testsuite-arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    # The AArch64 counterpart of the `wasi-p3-testsuite` job above, which
    # runs on x86_64 only. That single-architecture coverage is what let
    # #929 through: five P3 fixtures stalled under AOT on AArch64 while
    # all 41 passed on x86_64, and nothing in CI observed it.
    #
    # Blocking as of the #929 fix (AArch64 is at 41/41): this job is the
    # only thing standing between an AArch64-specific codegen regression
    # and main, so it is in `ci-summary`'s needs[].
    env:
      # Bound the harness so a stalled guest fails one fixture instead of
      # wedging the suite and burning the whole job timeout (#929).
      WAMR_TESTSUITE_TIMEOUT: "30"
      WAMR_TESTSUITE_OP_TIMEOUT: "30"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: true

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
          use-cache: false

      - name: Configure Zig caches
        uses: ./.github/actions/zig-cache

      - name: Install wasi-testsuite runner deps
        run: |
          python3 -m pip install --user --break-system-packages \
            -r tests/wasi-testsuite/test-runner/requirements.txt

      - name: Build wamr (ReleaseSafe)
        run: zig build -Doptimize=ReleaseSafe

      - name: Run unfiltered WASI Preview 3 conformance contract
        run: zig build wasi-p3-testsuite-unfiltered -Doptimize=ReleaseSafe

  jit-parity:
    name: Build & Test (jit-parity)
    runs-on: ubuntu-22.04
    # Non-blocking until the first green run + any flake handling lands
    # (mirrors the `component-examples-wasmtime` precedent below).
    # ci-summary intentionally leaves this out of its needs[] failure-gate.
    #
    # Proves the in-process JIT path (#852-#854) is behavior-identical
    # to the two-step AOT path the other jobs above exercise: builds
    # `wamr`/`wamrc` with `-Djit=true` and reruns the exact same P1/P3
    # conformance corpora + skip-lists through `wamr run <raw.wasm>`
    # directly (no `wamrc` precompile step — see `WAMR_JIT_TESTSUITE` in
    # `tests/wasi-testsuite-adapter/wamr-zig.py`), plus the spec-json
    # suite and the `zig build test` unit/smoke tests (which include the
    # #853/#854 core-wasm and component JIT smoke tests). See #856.
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: true

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
          use-cache: false

      - name: Configure Zig caches
        uses: ./.github/actions/zig-cache

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install wasi-testsuite runner deps
        run: |
          pip install --user -r tests/wasi-testsuite/test-runner/requirements.txt

      - name: Unit tests (Debug, includes #853/#854 JIT smoke tests)
        # Deliberately Debug here, not ReleaseSafe: `zig build test
        # -Doptimize=ReleaseSafe` currently fails 2 pre-existing,
        # JIT-unrelated differential SIMD NaN tests (#872, reproduces
        # identically without `-Djit=true` too). Running Debug first
        # dodges that bug while still exercising everything actually
        # relevant to this job (the #853/#854 JIT smoke tests aren't
        # optimize-mode-specific). The ReleaseSafe build below reinstalls
        # `zig-out/bin/wamr`/`wamrc` before the conformance steps run, so
        # this doesn't leave a stale Debug binary behind for them.
        run: zig build test -Djit=true

      - name: Build wamr (ReleaseSafe, -Djit=true)
        # ReleaseSafe for the same reason as `wasi-p3-testsuite` above;
        # doubly so here since the JIT path compiles every fixture from
        # scratch on every invocation (no cross-process `.cwasm` cache).
        run: zig build -Doptimize=ReleaseSafe -Djit=true

      - name: Spec tests (JSON, AOT pipeline)
        run: zig build spec-tests-aot -Doptimize=ReleaseSafe -Djit=true

      - name: Run WASI Preview 1 conformance suite through the JIT path
        run: zig build wasi-testsuite-jit -Doptimize=ReleaseSafe -Djit=true

      - name: Run unfiltered WASI Preview 3 contract through the JIT path
        run: zig build wasi-p3-testsuite-jit-unfiltered -Doptimize=ReleaseSafe -Djit=true

  lazy-jit:
    name: Build & Test (lazy-jit-${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux-x64
          - os: ubuntu-24.04-arm
            name: linux-arm64
    # Keep this focused on the unit/regression tests that exercise the
    # lazy-JIT implementation. The full in-process JIT conformance suites
    # remain in the separate, non-blocking `jit-parity` job above.
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: true

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
          use-cache: false

      - name: Configure Zig caches
        uses: ./.github/actions/zig-cache

      - name: Lazy-JIT unit and regression tests
        run: zig build test -Djit=true -Dlazy_jit=true

  component-examples-wasmtime:
    name: Build & Test (component-examples-wasmtime)
    runs-on: ubuntu-22.04
    # Non-blocking until the first green run + any flake handling lands.
    # ci-summary intentionally leaves this out of its needs[] failure-gate.
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: true

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
          use-cache: false

      - name: Configure Zig caches
        uses: ./.github/actions/zig-cache

      - name: Install cataggar/wabt (component CLI)
        uses: ./.github/actions/wabt-install

      - name: Install Rust wasm32-wasip1 target
        run: rustup target add wasm32-wasip1

      - name: Install wasmtime v46.0.1
        run: |
          curl https://wasmtime.dev/install.sh -sSf | bash -s -- --version v46.0.1
          echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"

      - name: Build and run component-examples (wasmtime parity)
        run: zig build install examples examples-run-wasmtime

  # Summary job matching the required status check name for branch protection.
  # `component-examples-wasmtime` is intentionally NOT in the blocking set
  # while the cross-runtime parity check beds in (cataggar/wamr#457).
  # `jit-parity` is likewise non-blocking; `lazy-jit` is included because
  # its architecture matrix is the required lazy-JIT coverage gate.
  ci-summary:
    name: Build & Test
    runs-on: ubuntu-22.04
    needs: [build-and-test, wasi-test, wasi-testsuite, component-examples, wasi-p2-testsuite, wasi-p3-testsuite, wasi-p3-testsuite-arm64, lazy-jit]
    if: always()
    steps:
      - name: Check results
        run: |
          if [ "${{ needs.build-and-test.result }}" != "success" ] || [ "${{ needs.wasi-test.result }}" != "success" ] || [ "${{ needs.wasi-testsuite.result }}" != "success" ] || [ "${{ needs.component-examples.result }}" != "success" ] || [ "${{ needs.wasi-p2-testsuite.result }}" != "success" ] || [ "${{ needs.wasi-p3-testsuite.result }}" != "success" ] || [ "${{ needs.wasi-p3-testsuite-arm64.result }}" != "success" ] || [ "${{ needs.lazy-jit.result }}" != "success" ]; then
            echo "::error::One or more CI jobs failed"
            exit 1
          fi
          echo "All CI jobs passed"
