name: CoreMark (x86_64)

# Per-PR CoreMark comparison on a GitHub-hosted x86_64 runner.
# Runs `scripts/bench_coremark.py` against the PR base, posts a delta table.

on:
  workflow_dispatch:
    inputs:
      baseline:
        description: "CoreMark baseline git ref"
        required: false
        default: "origin/main"
      loop_baseline:
        description: "Loop-pass baseline git ref"
        required: false
        default: "02276b06fb2ee10ba65c274ec8ac55734eb6404f"
      target:
        description: "Target git ref"
        required: false
        default: "HEAD"
      runs:
        description: "Runs per ref"
        required: false
        default: "3"
  pull_request:
    paths:
      - src/compiler/**
      - src/runtime/**
      - tests/benchmarks/coremark/**
      - tests/benchmarks/loop-passes/**
      - scripts/bench_coremark.py
      - scripts/bench_loop_passes.py
      - scripts/test_bench_coremark.py
      - scripts/test_bench_loop_passes.py
      - .github/workflows/coremark-x86_64.yml

concurrency:
  # Serialize per branch: parallel CoreMark invocations on the same runner
  # would contend on cores and skew results.
  group: coremark-x86_64-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  coremark:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Need the base commit to compare against, so deepen the checkout.
          fetch-depth: 0

      - name: Install Zig 0.16.0
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
          use-cache: false

      - name: Configure Zig caches
        uses: ./.github/actions/zig-cache

      - name: Test benchmark harnesses
        run: |
          python3 -m unittest \
            scripts/test_bench_coremark.py \
            scripts/test_bench_loop_passes.py

      - name: Resolve refs
        id: refs
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          INPUT_BASELINE: ${{ github.event.inputs.baseline }}
          INPUT_LOOP_BASELINE: ${{ github.event.inputs.loop_baseline }}
          INPUT_TARGET: ${{ github.event.inputs.target }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            echo "baseline=$BASE_SHA" >> "$GITHUB_OUTPUT"
            echo "loop_baseline=02276b06fb2ee10ba65c274ec8ac55734eb6404f" >> "$GITHUB_OUTPUT"
            echo "target=$HEAD_SHA"   >> "$GITHUB_OUTPUT"
          else
            echo "baseline=${INPUT_BASELINE:-origin/main}" >> "$GITHUB_OUTPUT"
            echo "loop_baseline=${INPUT_LOOP_BASELINE:-02276b06fb2ee10ba65c274ec8ac55734eb6404f}" >> "$GITHUB_OUTPUT"
            echo "target=${INPUT_TARGET:-HEAD}"            >> "$GITHUB_OUTPUT"
          fi

      - name: Run CoreMark comparison
        id: bench
        continue-on-error: true
        env:
          BASELINE: ${{ steps.refs.outputs.baseline }}
          TARGET: ${{ steps.refs.outputs.target }}
          RUNS: ${{ github.event.inputs.runs || '3' }}
        run: |
          # Match the aarch64 gate's tolerance band; CoreMark variance on
          # GitHub-hosted runners is comfortably wider than 0%.
          python3 scripts/bench_coremark.py \
            --baseline "$BASELINE" \
            --target   "$TARGET" \
            --profile  ci \
            --runs     "$RUNS" \
            --min-delta-pct=-5.0 \
            --out      coremark-table.md \
            --emit     github

      - name: Run focused loop-pass comparison
        id: loop_bench
        continue-on-error: true
        env:
          # Keep the throughput gate anchored to the last pre-#945 main
          # commit. A post-#945 PR base already contains the optimization and
          # cannot demonstrate that its measured win is still present.
          BASELINE: ${{ steps.refs.outputs.loop_baseline }}
          TARGET: ${{ steps.refs.outputs.target }}
        run: |
          python3 scripts/bench_loop_passes.py \
            --baseline "$BASELINE" \
            --target   "$TARGET" \
            --profile  ci \
            --min-speedup unroll4=20 \
            --out      loop-passes-table.md \
            --emit     github

      - name: Upload table
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coremark-x86_64-${{ github.sha }}
          path: |
            coremark-table.md
            loop-passes-table.md
          if-no-files-found: ignore
          retention-days: 90

      - name: Comment on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const fs = require('fs');
            const reports = ['coremark-table.md', 'loop-passes-table.md']
              .filter(file => fs.existsSync(file))
              .map(file => fs.readFileSync(file, 'utf8'));
            if (reports.length === 0) {
              core.warning('benchmark reports were not produced');
              return;
            }
            const body = reports.join('\n\n');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      - name: Fail on benchmark regression
        if: steps.bench.outcome == 'failure' || steps.loop_bench.outcome == 'failure'
        run: exit 1
