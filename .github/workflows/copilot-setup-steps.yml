name: "Copilot Setup Steps"

# Pre-provisions the Copilot cloud agent's ephemeral dev environment.
# Keeping this in sync with .github/workflows/ci.yml lets the agent
# reproduce CI locally before it opens a PR.
#
# Trigger the workflow when the setup file itself changes so the
# config can be validated like any other workflow change.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # Name must be exactly `copilot-setup-steps` for Copilot to pick it up.
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: true

      - name: Install gh-aw extension
        uses: github/gh-aw-actions/setup-cli@ba90f2186d7ad780ec640f364005fa24e797b360 # v0.68.3
        with:
          version: v0.68.3

      - name: Install Zig 0.17.0
        uses: cataggar/ghr/actions/install@7d8c3ef0886dd428a97727fce3b74909d6eace78 # v0.6.6
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          ghr-version: 0.6.6
          tools: |
            cataggar/zig@v0.17.0 RWSGOq2NVecA2UPNdBUZykf1CCb147pkmdtYxgb3Ti+JO/wCYvhbAb/U

      - name: Configure Zig caches
        uses: ./.github/actions/zig-cache

      - name: Install cataggar/wabt (component CLI)
        uses: ./.github/actions/wabt-install

      - name: Cache Zig global cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.ZIG_GLOBAL_CACHE_DIR }}
          key: zig-cache-${{ runner.os }}-0.17.0-${{ hashFiles('build.zig', 'build.zig.zon') }}
          restore-keys: |
            zig-cache-${{ runner.os }}-0.17.0-

      - name: Warm build (Debug + ReleaseSafe)
        continue-on-error: true
        run: |
          zig build
          zig build -Doptimize=safe

      - name: Smoke test
        continue-on-error: true
        run: |
          zig build test
          if [ -d tests/spec-json ]; then
            ./zig-out/bin/spec-test-runner tests/spec-json 2>&1 | tail -6 || true
          fi
