name: "Copilot Setup Steps"

# Pre-provisions the Copilot cloud agent's ephemeral dev environment.
# Keeping this in sync with .github/workflows/ci.yml lets the agent
# reproduce CI locally before it opens a PR.
#
# Trigger the workflow when the setup file itself changes so the
# config can be validated like any other workflow change.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # Name must be exactly `copilot-setup-steps` for Copilot to pick it up.
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: true

      - name: Install gh-aw extension
        uses: github/gh-aw-actions/setup-cli@ba90f2186d7ad780ec640f364005fa24e797b360 # v0.68.3
        with:
          version: v0.68.3

      - name: Install Zig 0.16.0
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
          use-cache: false

      - name: Configure Zig caches
        uses: ./.github/actions/zig-cache

      - name: Install cataggar/wabt v3.0.0-dev.5 (component CLI)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # ghr-bin is a tiny PyPI wrapper that downloads sha256-verified
          # GitHub release archives and links the chosen binary into
          # ~/.local/bin. pipx is preinstalled on ubuntu-latest; pip is
          # blocked by PEP 668. Pin both ghr-bin and the wabt release.
          # GH_TOKEN is forwarded so `ghr` uses the workflow's
          # authenticated quota (5000/hr) instead of the runner IP's
          # unauthenticated 60/hr GitHub API limit.
          pipx install ghr-bin==0.1.6
          ghr install cataggar/wabt@v3.0.0-dev.5
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/wabt" version

      - name: Cache Zig global cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.ZIG_GLOBAL_CACHE_DIR }}
          key: zig-cache-${{ runner.os }}-0.16.0-${{ hashFiles('build.zig', 'build.zig.zon') }}
          restore-keys: |
            zig-cache-${{ runner.os }}-0.16.0-

      - name: Warm build (Debug + ReleaseSafe)
        continue-on-error: true
        run: |
          zig build
          zig build -Doptimize=ReleaseSafe

      - name: Smoke test
        continue-on-error: true
        run: |
          zig build test
          if [ -d tests/spec-json ]; then
            ./zig-out/bin/spec-test-runner tests/spec-json 2>&1 | tail -6 || true
          fi
