name: Publish wamr-bin to PyPI

on:
  push:
    branches: [pypi]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish"
        required: false
        default: "3.0.0-dev.5"

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Extract version
        id: version
        run: |
          V="${{ inputs.version || '3.0.0-dev.5' }}"
          echo "version=${V#v}" >> "$GITHUB_OUTPUT"
      - name: Build wheels
        run: uv run scripts/build_wheels.py ${{ steps.version.outputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
