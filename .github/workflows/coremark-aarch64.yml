name: CoreMark (aarch64)

# Per-PR CoreMark comparison on a hosted aarch64 runner.
# Runs `scripts/bench_coremark.py` against the PR base, posts a delta table.

on:
  workflow_dispatch:
    inputs:
      baseline:
        description: "Baseline git ref"
        required: false
        default: "origin/main"
      target:
        description: "Target git ref"
        required: false
        default: "HEAD"
      runs:
        description: "Runs per ref"
        required: false
        default: "3"
      benchmark_memory_size:
        description: "Run the memory-size pin ten-run A/B gate"
        required: false
        type: boolean
        default: false
  pull_request:
    paths:
      - src/compiler/**
      - src/runtime/**
      - tests/benchmarks/coremark/**
      - scripts/bench_coremark.py
      - scripts/test_bench_coremark.py
      - .github/workflows/coremark-aarch64.yml

concurrency:
  # Keep one canonical ARM64 comparison active at a time.
  group: coremark-aarch64
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  coremark:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Need the base commit to compare against, so deepen the checkout.
          fetch-depth: 0

      - name: Install Zig 0.16.0
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
          use-cache: false

      - name: Configure Zig caches
        uses: ./.github/actions/zig-cache

      - name: Test CoreMark harness
        run: python3 -m unittest scripts/test_bench_coremark.py

      - name: Resolve refs
        id: refs
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          INPUT_BASELINE: ${{ github.event.inputs.baseline }}
          INPUT_TARGET: ${{ github.event.inputs.target }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            echo "baseline=$BASE_SHA" >> "$GITHUB_OUTPUT"
            echo "target=$HEAD_SHA"   >> "$GITHUB_OUTPUT"
          else
            echo "baseline=${INPUT_BASELINE:-origin/main}" >> "$GITHUB_OUTPUT"
            echo "target=${INPUT_TARGET:-HEAD}"            >> "$GITHUB_OUTPUT"
          fi

      - name: Run CoreMark comparison
        if: github.event_name != 'workflow_dispatch' || inputs.benchmark_memory_size != true
        id: bench
        continue-on-error: true
        env:
          BASELINE: ${{ steps.refs.outputs.baseline }}
          TARGET: ${{ steps.refs.outputs.target }}
          RUNS: ${{ github.event.inputs.runs || '3' }}
        run: |
          python3 scripts/bench_coremark.py \
            --baseline "$BASELINE" \
            --target   "$TARGET" \
            --profile  ci \
            --runs     "$RUNS" \
            --min-delta-pct=-5.0 \
            --out      coremark-table.md \
            --emit     github

      - name: Benchmark AArch64 memory-size pin
        if: github.event_name == 'workflow_dispatch' && inputs.benchmark_memory_size
        env:
          ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-global-cache
        run: |
          set -euxo pipefail
          zig build -Doptimize=ReleaseFast
          mkdir -p memory-size-bench
          WAMR_AOT_DISABLE_MEMORY_SIZE_PIN=1 \
            ./zig-out/bin/wamrc compile \
              tests/benchmarks/coremark/coremark_wasi.wasm \
              -o memory-size-bench/baseline.cwasm
          ./zig-out/bin/wamrc compile \
            tests/benchmarks/coremark/coremark_wasi.wasm \
            -o memory-size-bench/target.cwasm

          python3 - <<'PY'
          import json
          import re
          import statistics
          import subprocess
          from pathlib import Path

          pattern = re.compile(r"Iterations/Sec\s*:\s*([0-9.]+)")
          validation = "Correct operation validated."
          commands = {
              "baseline": ["./zig-out/bin/wamr", "run", "memory-size-bench/baseline.cwasm"],
              "target": ["./zig-out/bin/wamr", "run", "memory-size-bench/target.cwasm"],
          }
          values = {name: [] for name in commands}
          sequence = ["baseline", "target", "target", "baseline"] * 5
          for index, name in enumerate(sequence, 1):
              output = subprocess.run(
                  commands[name], check=True, text=True, capture_output=True
              )
              combined = output.stdout + output.stderr
              if validation not in combined:
                  raise SystemExit(f"{name} run {index}: missing CRC validation")
              matches = pattern.findall(combined)
              if len(matches) != 1:
                  raise SystemExit(f"{name} run {index}: expected one score, got {matches}")
              values[name].append(float(matches[0]))

          baseline = statistics.median(values["baseline"])
          target = statistics.median(values["target"])
          delta = (target / baseline - 1.0) * 100.0
          report = {
              "baseline": values["baseline"],
              "target": values["target"],
              "baseline_median": baseline,
              "target_median": target,
              "median_delta_pct": delta,
          }
          Path("memory-size-bench/results.json").write_text(
              json.dumps(report, indent=2) + "\n", encoding="utf-8"
          )
          lines = [
              "# AArch64 memory-size pin benchmark",
              "",
              f"- Baseline median: {baseline:.1f} iter/s",
              f"- Target median: {target:.1f} iter/s",
              f"- Median delta: {delta:+.2f}%",
              f"- Baseline samples: {', '.join(f'{x:.1f}' for x in values['baseline'])}",
              f"- Target samples: {', '.join(f'{x:.1f}' for x in values['target'])}",
          ]
          Path("memory-size-bench/results.md").write_text(
              "\n".join(lines) + "\n", encoding="utf-8"
          )
          print("\n".join(lines))
          PY

      - name: Upload memory-size benchmark
        if: always() && github.event_name == 'workflow_dispatch' && inputs.benchmark_memory_size
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aarch64-memory-size-benchmark-${{ github.sha }}
          path: memory-size-bench/
          if-no-files-found: error
          retention-days: 30

      - name: Upload table
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coremark-aarch64-${{ github.sha }}
          path: coremark-table.md
          if-no-files-found: ignore
          retention-days: 90

      - name: Comment on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('coremark-table.md')) {
              core.warning('coremark-table.md was not produced');
              return;
            }
            const body = fs.readFileSync('coremark-table.md', 'utf8');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      - name: Fail on CoreMark regression
        if: steps.bench.outcome == 'failure'
        run: exit 1
